<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="grad1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#3b82f6;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#06b6d4;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#8b5cf6;stop-opacity:1" />
    </linearGradient>
    <radialGradient id="vinyl" cx="50%" cy="50%" r="50%">
      <stop offset="0%" style="stop-color:#18181b;stop-opacity:1" />
      <stop offset="70%" style="stop-color:#09090b;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#000000;stop-opacity:1" />
    </radialGradient>
  </defs>
  <rect width="512" height="512" rx="128" fill="#09090b"/>
  <!-- Vinyl Platter Outer -->
  <circle cx="256" cy="256" r="200" fill="url(#vinyl)" stroke="#27272a" stroke-width="6"/>
  <!-- Grooves -->
  <circle cx="256" cy="256" r="165" fill="none" stroke="#27272a" stroke-width="2" stroke-dasharray="8 6"/>
  <circle cx="256" cy="256" r="130" fill="none" stroke="#27272a" stroke-width="2"/>
  <circle cx="256" cy="256" r="95" fill="none" stroke="#27272a" stroke-width="2" stroke-dasharray="12 8"/>
  <!-- Center Platter -->
  <circle cx="256" cy="256" r="70" fill="url(#grad1)"/>
  <!-- Spindle Hole -->
  <circle cx="256" cy="256" r="20" fill="#09090b" stroke="#ffffff" stroke-width="4"/>
  <!-- Tonearm Stylus -->
  <path d="M 400 90 L 310 210 L 290 230" fill="none" stroke="#06b6d4" stroke-width="8" stroke-linecap="round"/>
  <circle cx="400" cy="90" r="16" fill="#3b82f6"/>
</svg>
